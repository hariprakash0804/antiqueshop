<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="nexus-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="nexus-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>

    <!-- Dark Shield Gradient -->
    <linearGradient id="nexus-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#nexus-dark)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#nexus-gold)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Outer Cyber Hexagon Shield -->
  <polygon points="32,7 54,19.5 54,44.5 32,57 10,44.5 10,19.5" fill="none" stroke="url(#nexus-gold)" stroke-width="2.5" stroke-linejoin="round" filter="url(#gold-glow)"/>

  <!-- Inner Cyan Accent Wireframe -->
  <polygon points="32,11 50,21.5 50,42.5 32,53 14,42.5 14,21.5" fill="none" stroke="url(#nexus-cyan)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Central Stylized "N" Monogram -->
  <!-- Left Bar -->
  <path d="M 20 43 V 21 L 25 18 V 40 Z" fill="url(#nexus-gold)"/>

  <!-- Right Bar -->
  <path d="M 44 21 V 43 L 39 46 V 24 Z" fill="url(#nexus-gold)"/>

  <!-- Diagonal Slash -->
  <path d="M 20 21 L 39 46 L 44 43 L 25 18 Z" fill="url(#nexus-gold)" filter="url(#gold-glow)"/>

  <!-- Central Nexus Core (Cyan Gem) -->
  <polygon points="32,27 37,32 32,37 27,32" fill="url(#nexus-cyan)" filter="url(#cyan-glow)"/>

  <!-- Cyber Node Accents -->
  <circle cx="32" cy="11" r="1.5" fill="#00F0FF"/>
  <circle cx="32" cy="53" r="1.5" fill="#D4AF37"/>
</svg>